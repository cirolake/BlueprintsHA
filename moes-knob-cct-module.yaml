blueprint:
  name: Zigbee2MQTT - Moes Knob controls CCT module
  description: >
    One Moes smart knob (ERS-10TZBVK-AA) controls one CCT (tunable white)
    module such as the Miboxer FUT035Z, both paired in Zigbee2MQTT.
    Create one automation per knob.

    - Click: toggle the light on / off.

    - Rotate right / left: brightness up / down.

    - Press and rotate right / left: cooler / warmer white.

    Each change uses the step size and transition time the knob reports
    (a bigger turn sends a bigger step), with the step multiplied by the
    brightness or color temperature sensitivity. The light stops at its minimum brightness and
    color temperature limits by itself.

    The knob should be in **command** mode (press it 3 times quickly, or set
    "Operation mode" to "command" in the Zigbee2MQTT device page).
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  input:
    knob:
      name: Knob
      description: >
        Any entity of the knob (for example its battery or operation mode).
        The knob itself is found from the entity's device.
      selector:
        entity:
          filter:
            - integration: mqtt
    light:
      name: CCT light
      description: The CCT module's light entity, paired in Zigbee2MQTT.
      selector:
        entity:
          filter:
            - domain: light
              integration: mqtt
    advanced:
      name: Advanced
      collapsed: true
      input:
        brightness_sensitivity:
          name: Brightness sensitivity
          description: >
            Multiplies the step size reported by the knob when turning.
            1 = as reported, 0.5 = half as much change, 2 = twice as much.
          default: 1
          selector:
            number: { min: 0.1, max: 3, step: 0.1, mode: slider }
        temperature_sensitivity:
          name: Color temperature sensitivity
          description: >
            Multiplies the step size reported by the knob when pressing and
            turning. 1 = as reported, 0.5 = half as much change, 2 = twice as much.
          default: 1
          selector:
            number: { min: 0.1, max: 3, step: 0.1, mode: slider }
        use_transition:
          name: Use the knob's transition time
          description: >
            On: each change fades over the time the knob reports (0.1-0.3 s).
            Off: changes are applied instantly.
          default: true
          selector:
            boolean:
        base_topic:
          name: Zigbee2MQTT base topic
          description: Only change if you changed base_topic in the Zigbee2MQTT config.
          default: zigbee2mqtt
          selector:
            text:

mode: single
max: 10
max_exceeded: silent

trigger_variables:
  base_topic: !input base_topic

# Zigbee2MQTT sends the knob's action in its state message on <base>/<name>.
triggers:
  - trigger: mqtt
    topic: "{{ base_topic ~ '/+' }}"
    value_template: "{{ value_json.action | default('') }}"
    payload: toggle
  - trigger: mqtt
    topic: "{{ base_topic ~ '/+' }}"
    value_template: "{{ value_json.action | default('') }}"
    payload: brightness_step_up
  - trigger: mqtt
    topic: "{{ base_topic ~ '/+' }}"
    value_template: "{{ value_json.action | default('') }}"
    payload: brightness_step_down
  - trigger: mqtt
    topic: "{{ base_topic ~ '/+' }}"
    value_template: "{{ value_json.action | default('') }}"
    payload: color_temperature_step_up
  - trigger: mqtt
    topic: "{{ base_topic ~ '/+' }}"
    value_template: "{{ value_json.action | default('') }}"
    payload: color_temperature_step_down

variables:
  knob: !input knob
  light: !input light
  brightness_sensitivity: !input brightness_sensitivity
  temperature_sensitivity: !input temperature_sensitivity
  use_transition: !input use_transition
  action: "{{ trigger.payload_json.action }}"
  # Step on the Zigbee 0-255 scale (smallest click ~13, big turn ~133).
  sensitivity: "{{ brightness_sensitivity if action.startswith('brightness') else temperature_sensitivity }}"
  step: "{{ (trigger.payload_json.action_step_size | int(0) * sensitivity | float) | round(0) | int }}"
  # How long the knob asks the light to take to reach the new value (e.g. 0.1 s),
  # or 0 (instant) when use_transition is off.
  transition: "{{ trigger.payload_json.action_transition_time | float(0) if use_transition else 0 }}"
  # Device name in Home Assistant = friendly name in Zigbee2MQTT.
  knob_topic: "{{ base_topic ~ '/' ~ device_attr(device_id(knob), 'name') }}"
  light_topic: "{{ base_topic ~ '/' ~ device_attr(device_id(light), 'name') ~ '/set' }}"

conditions:
  - "{{ trigger.topic == knob_topic }}"

# Commands go straight to the light through Zigbee2MQTT, which steps from the
# light's current value and keeps it inside the light's limits.
#   brightness_step: 0-254 scale, the same scale as the knob's step size
#   color_temp_step: mireds, where more mireds = warmer
actions:
  - choose:
      - conditions: "{{ action == 'toggle' }}"
        sequence:
          - action: mqtt.publish
            data:
              topic: "{{ light_topic }}"
              payload: '{"state": "TOGGLE"}'

      - conditions: "{{ action in ['brightness_step_up', 'brightness_step_down'] }}"
        sequence:
          - action: mqtt.publish
            data:
              topic: "{{ light_topic }}"
              payload: >
                {"brightness_step": {{ step if action == 'brightness_step_up' else -step }},
                 "transition": {{ transition }}}

      # Rotate right = cooler = fewer mireds.
      - conditions: "{{ action in ['color_temperature_step_up', 'color_temperature_step_down'] }}"
        sequence:
          - action: mqtt.publish
            data:
              topic: "{{ light_topic }}"
              payload: >
                {"color_temp_step": {{ step if action == 'color_temperature_step_up' else -step }},
                 "transition": {{ transition }}}
