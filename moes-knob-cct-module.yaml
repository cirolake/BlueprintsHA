blueprint:
  name: Zigbee2MQTT - Moes Knob controls CCT module
  description: >
    One Moes smart knob (ERS-10TZBVK-AA) controls one CCT (tunable white)
    module such as the Miboxer FUT035Z, both paired in Zigbee2MQTT.
    Create one automation per knob.

    - Click: toggle the light on / off.

    - Rotate right / left: brightness up / down.

    - Press and rotate right / left: cooler / warmer white.

    The knob should be in **command** mode (press it 3 times quickly, or set
    "Operation mode" to "command" in the Zigbee2MQTT device page).
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  input:
    knob:
      name: Knob
      description: >
        Any entity of the knob (for example its battery or operation mode).
        The knob itself is found from the entity's device.
      selector:
        entity:
          filter:
            - integration: mqtt
    light:
      name: CCT light
      selector:
        entity:
          filter:
            - domain: light
    advanced:
      name: Advanced
      collapsed: true
      input:
        brightness_step:
          name: Brightness step
          default: 10
          selector:
            number: { min: 1, max: 50, step: 1, unit_of_measurement: "%" }
        kelvin_step:
          name: Color temperature step
          default: 250
          selector:
            number: { min: 50, max: 1000, step: 50, unit_of_measurement: K }
        base_topic:
          name: Zigbee2MQTT base topic
          description: Only change if you changed base_topic in the Zigbee2MQTT config.
          default: zigbee2mqtt
          selector:
            text:

mode: single
max: 10
max_exceeded: silent

trigger_variables:
  base_topic: !input base_topic

# Zigbee2MQTT sends the knob's action in its state message on <base>/<name>.
triggers:
  - trigger: mqtt
    topic: "{{ base_topic ~ '/+' }}"
    value_template: "{{ value_json.action | default('') }}"
    payload: toggle
  - trigger: mqtt
    topic: "{{ base_topic ~ '/+' }}"
    value_template: "{{ value_json.action | default('') }}"
    payload: brightness_step_up
  - trigger: mqtt
    topic: "{{ base_topic ~ '/+' }}"
    value_template: "{{ value_json.action | default('') }}"
    payload: brightness_step_down
  - trigger: mqtt
    topic: "{{ base_topic ~ '/+' }}"
    value_template: "{{ value_json.action | default('') }}"
    payload: color_temperature_step_up
  - trigger: mqtt
    topic: "{{ base_topic ~ '/+' }}"
    value_template: "{{ value_json.action | default('') }}"
    payload: color_temperature_step_down

variables:
  knob: !input knob
  light: !input light
  step: !input brightness_step
  k_step: !input kelvin_step
  action: "{{ trigger.payload_json.action }}"
  # Device name in Home Assistant = friendly name in Zigbee2MQTT.
  knob_topic: "{{ base_topic ~ '/' ~ device_attr(device_id(knob), 'name') }}"

conditions:
  - "{{ trigger.topic == knob_topic }}"

actions:
  - choose:
      - conditions: "{{ action == 'toggle' }}"
        sequence:
          - action: light.toggle
            target:
              entity_id: "{{ light }}"

      - conditions: "{{ action == 'brightness_step_up' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light }}"
            data:
              brightness_step_pct: "{{ step | int }}"

      - conditions: "{{ action == 'brightness_step_down' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light }}"
            data:
              brightness_step_pct: "{{ -(step | int) }}"

      - conditions: "{{ action in ['color_temperature_step_up', 'color_temperature_step_down'] }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light }}"
            data:
              color_temp_kelvin: >
                {% set lo = state_attr(light, 'min_color_temp_kelvin') | int(2000) %}
                {% set hi = state_attr(light, 'max_color_temp_kelvin') | int(6500) %}
                {% set cur = state_attr(light, 'color_temp_kelvin') | int((lo + hi) // 2) %}
                {% set delta = k_step | int if action == 'color_temperature_step_up' else -(k_step | int) %}
                {{ [[cur + delta, hi] | min, lo] | max }}
