blueprint:
  name: Zigbee2MQTT - Moes Knob CCT
  description: >
    Reusable version of the "Moes Knob" automation. Works with any Moes / Tuya
    smart knob (ERS-10TZBVK-AA and similar) paired in Zigbee2MQTT.

    - Click: toggle the light(s).
    - Rotate right / left: brightness up / down in steps (default 10%).
    - Press and rotate right: cool white (default 6500 K).
    - Press and rotate left: warm white (default 2000 K).

    The knob must be in **command** mode (press it 3 times quickly, or set
    "Operation mode" to "command" in the Zigbee2MQTT device page).
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  input:
    knob:
      name: Knob
      description: The Moes knob, as a device paired in Zigbee2MQTT.
      selector:
        device:
          filter:
            - integration: mqtt
          multiple: false
    light_target:
      name: Light(s)
      description: The light or lights the knob controls.
      selector:
        target:
          entity:
            - domain: light
    advanced:
      name: Advanced
      collapsed: true
      input:
        brightness_step:
          name: Brightness step
          description: Brightness change per knob step.
          default: 10
          selector:
            number: { min: 1, max: 50, step: 1, unit_of_measurement: "%" }
        warm_kelvin:
          name: Warm white
          description: Color temperature set when pressing and rotating left.
          default: 2000
          selector:
            number: { min: 1500, max: 6500, step: 100, unit_of_measurement: K }
        cool_kelvin:
          name: Cool white
          description: Color temperature set when pressing and rotating right.
          default: 6500
          selector:
            number: { min: 2000, max: 10000, step: 100, unit_of_measurement: K }
        base_topic:
          name: Zigbee2MQTT base topic
          description: Leave as zigbee2mqtt unless you changed it in Zigbee2MQTT's configuration.
          default: zigbee2mqtt
          selector:
            text:

trigger_variables:
  base_topic: !input base_topic

triggers:
  # Every Zigbee2MQTT device publishes its button actions on <base>/<name>/action.
  # The condition below keeps only the selected knob.
  - trigger: mqtt
    topic: "{{ base_topic ~ '/+/action' }}"

variables:
  knob: !input knob
  step: !input brightness_step
  warm_kelvin: !input warm_kelvin
  cool_kelvin: !input cool_kelvin
  knob_topic: "{{ base_topic ~ '/' ~ device_attr(knob, 'name') ~ '/action' }}"
  action: "{{ trigger.payload }}"

conditions:
  - "{{ trigger.topic == knob_topic }}"

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ action == 'brightness_step_up' }}"
        sequence:
          - action: light.turn_on
            data:
              brightness_step_pct: "{{ step | int }}"
            target: !input light_target
      - conditions:
          - condition: template
            value_template: "{{ action == 'brightness_step_down' }}"
        sequence:
          - action: light.turn_on
            data:
              brightness_step_pct: "{{ step | int * -1 }}"
            target: !input light_target
      - conditions:
          - condition: template
            value_template: "{{ action == 'toggle' }}"
        sequence:
          - action: light.toggle
            target: !input light_target
      - conditions:
          - condition: template
            value_template: "{{ action == 'color_temperature_step_down' }}"
        sequence:
          - action: light.turn_on
            data:
              color_temp_kelvin: "{{ warm_kelvin | int }}"
            target: !input light_target
      - conditions:
          - condition: template
            value_template: "{{ action == 'color_temperature_step_up' }}"
        sequence:
          - action: light.turn_on
            data:
              color_temp_kelvin: "{{ cool_kelvin | int }}"
            target: !input light_target

mode: single
