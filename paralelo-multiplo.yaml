blueprint:
  name: Paralelo Multiplo 1praN
  description: >
    Keeps a main entity in sync with a group of source entities, in both
    directions. Turning the main entity on or off turns all sources on or off.
    Turning a source on turns the main entity on (without touching the other
    sources), and turning the last source off turns the main entity off.
    The main entity is on if and only if at least one source is on.
    The main entity must not be one of the source entities.
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    source_entities:
      name: Source entities
      description: Switches or lights controlled by the main entity. If any of them is on, the main entity turns on.
      selector:
        entity:
          domain:
            - switch
            - light
            - input_boolean
          multiple: true
    target_entity:
      name: Main entity
      description: The switch or light that turns all sources on or off.
      selector:
        entity:
          domain:
            - switch
            - light
            - input_boolean

mode: queued
max_exceeded: silent

variables:
  sources: !input source_entities
  target: !input target_entity

triggers:
  - trigger: state
    entity_id: !input source_entities
    from: ["on", "off"]
    to: ["on", "off"]
    id: source
  - trigger: state
    entity_id: !input target_entity
    from: ["on", "off"]
    to: ["on", "off"]
    id: target

actions:
  - variables:
      any_on: "{{ sources | select('is_state', 'on') | list | count > 0 }}"
      target_on: "{{ is_state(target, 'on') }}"
  - choose:
      # Main turned on by the user (all sources off) -> turn all sources on.
      # If a source is already on, the main was turned on by this automation.
      - conditions: "{{ trigger.id == 'target' and trigger.to_state.state == 'on' and not any_on }}"
        sequence:
          - action: homeassistant.turn_on
            target:
              entity_id: "{{ sources }}"
      # Main turned off by the user (some source on) -> turn all sources off.
      - conditions: "{{ trigger.id == 'target' and trigger.to_state.state == 'off' and any_on }}"
        sequence:
          - action: homeassistant.turn_off
            target:
              entity_id: "{{ sources }}"
      # A source turned on -> turn only the main on.
      # Checking the direction avoids a race: when the main turns all sources
      # off, one source may report off while another still shows on.
      - conditions: "{{ trigger.id == 'source' and trigger.to_state.state == 'on' and not target_on }}"
        sequence:
          - action: homeassistant.turn_on
            target:
              entity_id: "{{ target }}"
      # The last source turned off -> turn the main off.
      - conditions: "{{ trigger.id == 'source' and trigger.to_state.state == 'off' and not any_on and target_on }}"
        sequence:
          - action: homeassistant.turn_off
            target:
              entity_id: "{{ target }}"
